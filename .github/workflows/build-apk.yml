name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IC_KEYSTORE_BASE64: ${{ secrets.IC_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 still runs `sdkmanager tools`, and
      # that package no longer exists (the action dies before installing
      # anything). The ubuntu runner already ships cmdline-tools, so use its
      # sdkmanager directly.
      - name: Install SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      # --------------------------------------------------------------------
      # NEW: rebuild the core C binary from source.  The repo commits a
      # prebuilt apk-gradle/app/src/main/assets/ic-timer (built on the
      # author's machine); without this step, changes to core/anchors.h or
      # core/profiles.h never reach the APK and every build keeps shipping
      # the old offset tables ("缺少偏移" on builds that are not in them).
      # r27c + API 29 is required: older NDK/API combos emit an underaligned
      # TLS segment that the arm64 bionic linker refuses at exec time.
      - name: Set up NDK r27c
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ndk.zip" \
            https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"

      - name: Build core ic-timer from source
        run: |
          chmod +x core/build.sh
          CC="$RUNNER_TEMP/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" \
            core/build.sh "$RUNNER_TEMP/ic-timer" pd2571
          cp "$RUNNER_TEMP/ic-timer" apk-gradle/app/src/main/assets/ic-timer
          # fail the build early if the new table did not make it in
          grep -q "ic_pd2456_161175_links" apk-gradle/app/src/main/assets/ic-timer
      # --------------------------------------------------------------------

      # The repository keeps a local-only aapt2 path for the author's machine;
      # CI resolves aapt2 from Maven instead.
      - name: Drop local aapt2 override
        run: sed -i '/aapt2FromMavenOverride/d' apk-gradle/gradle.properties

      # Optional: add IC_KEYSTORE_BASE64 (base64 of a .jks) to repository
      # secrets to get a signed release APK. Without it the release artifact
      # is unsigned; the debug APK is always installable.
      - name: Decode signing keystore
        if: env.IC_KEYSTORE_BASE64 != ''
        run: echo "$IC_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ic.keystore"

      - name: Build APKs
        working-directory: apk-gradle
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon \
            -Pic.keystore="$RUNNER_TEMP/ic.keystore"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ic-timer-lpe-apk
          path: |
            apk-gradle/app/build/outputs/apk/release/*.apk
            apk-gradle/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
